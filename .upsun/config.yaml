# .upsun/config.yaml
applications:
  myapp:
    source:
      root: "/"

    type: "nodejs:24"

    mounts:
      "/.pnpm-store":
        source: local
        source_path: pnpm_store

    build:
      flavor: none

    hooks:
      build: |
        # Fetch source from upstream cloudflare/vinext hackernews example
        git clone --depth 1 --filter=blob:none --sparse https://github.com/cloudflare/vinext.git /tmp/vinext-src
        cd /tmp/vinext-src && git sparse-checkout set examples/hackernews
        cp -r /tmp/vinext-src/examples/hackernews/. $PLATFORM_APP_DIR/
        cd $PLATFORM_APP_DIR

        # Fix vinext dependency: replace workspace:* with npm version
        sed -i 's/"vinext": "workspace:\*"/"vinext": "^0.0.12"/' package.json

        # Apply Upsun branding
        sed -i 's/Cloudflare Workers/Upsun/g' components/server-info.jsx

        # Install and build
        npm i -g pnpm@10 && pnpm i --no-frozen-lockfile && pnpm run build

    web:
      commands:
        start: "pnpm start"
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "myapp:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"
