# .upsun/config.yaml
applications:
  myapp:
    source:
      root: "/"

    type: "nodejs:24"

    mounts:
      "/.pnpm-store":
        source: local
        source_path: pnpm_store

    build:
      flavor: none

    hooks:
      build: |
        # Save our Upsun-specific deployment files before upstream overwrites them
        cp $PLATFORM_APP_DIR/package.json /tmp/upsun-package.json
        cp $PLATFORM_APP_DIR/vite.config.ts /tmp/upsun-vite.config.ts

        # Fetch source from upstream cloudflare/vinext hackernews example
        git clone --depth 1 --filter=blob:none --sparse https://github.com/cloudflare/vinext.git /tmp/vinext-src
        cd /tmp/vinext-src && git sparse-checkout set examples/hackernews
        cp -r /tmp/vinext-src/examples/hackernews/. $PLATFORM_APP_DIR/
        cd $PLATFORM_APP_DIR

        # Restore our Upsun-targeted overrides
        cp /tmp/upsun-package.json $PLATFORM_APP_DIR/package.json
        cp /tmp/upsun-vite.config.ts $PLATFORM_APP_DIR/vite.config.ts

        # Apply Upsun branding
        find . -type f -exec sed -i 's/Cloudflare Workers/Upsun/g' {} +

        # Install and build
        npm i -g pnpm@10 && pnpm i --no-frozen-lockfile && pnpm run build

    web:
      commands:
        start: "pnpm start"
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "myapp:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"
